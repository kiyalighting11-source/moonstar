name: moonstar_erp
description: Moonstar ERP - نظام إداري كامل
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Backend
  supabase_flutter: ^2.5.0

  # State
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # HTTP
  dio: ^5.4.3

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  intl: ^0.20.3
  shimmer: ^3.0.0

  # Video
  video_player: ^2.9.2

  # Media
  image_picker: ^1.1.2

  # Forms
  reactive_forms: ^17.0.0

  # Utils
  uuid: ^4.4.0
  logger: ^2.3.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # PDF
  pdf: ^3.10.8
  printing: ^5.12.0
  open_file: ^3.5.6

  # Charts
  fl_chart: ^0.68.0

  # Calendar
  table_calendar: ^3.1.2

  # Location
  geolocator: ^13.0.1
  device_info_plus: ^10.1.2
  permission_handler: ^11.3.1

  # Sharing
  share_plus: ^10.0.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.4

  # Tables
  data_table_2: ^2.5.15

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  # ⭐ لتوليد الأيقونات
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/videos/
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/icon/

# =====================================================
# ⭐ إعدادات أيقونة التطبيق
# =====================================================
flutter_launcher_icons:
  # Android
  android: true
  min_sdk_android: 21

  # iOS
  ios: true
  remove_alpha_ios: true

  # Web
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#6A1B9A"
    theme_color: "#6A1B9A"

  # الأيقونة الأساسية
  image_path: "assets/icon/app_icon.png"

  # Android Adaptive Icon
  adaptive_icon_background: "#6A1B9A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"