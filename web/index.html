<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    ⭐ مهم: لا تغيّر السطر ده يدوياً.
    Flutter هيستبدل $FLUTTER_BASE_HREF تلقائياً وقت البناء.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Moonstar ERP - نظام إداري كامل">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Moonstar ERP">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MoonStar</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    ⭐ Spinner تحميل بسيط عشان لو الأبلكيشن أخد وقت
    هيختفي تلقائياً بعد ما Flutter يشتغل.
  -->
  <div id="loading" style="
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #6A1B9A 0%, #9C4DCC 100%);
    font-family: Cairo, sans-serif;
    color: white;
    z-index: 9999;
    transition: opacity 0.3s ease-out;
  ">
    <div style="
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    "></div>
    <p style="margin-top: 20px; font-size: 18px; font-weight: 600;">
      جارٍ التحميل...
    </p>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    // ⭐ نخفي الـ loading لما Flutter يخلّص أول frame
    window.addEventListener('flutter-first-frame', function () {
      const el = document.getElementById('loading');
      if (el) {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
